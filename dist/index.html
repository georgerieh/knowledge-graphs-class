<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/app.css" type="text/css">
    <title>Academic Citation Network Explorer</title>
</head>

<body>
    <header class="scholar-header">
        <div class="header-content">
            <div class="brand-section">
                <h1>Academic Citation Network</h1>
                <p class="subtitle">Graph Database Explorer by Georg Riekhakainen</p>
            </div>
            <div class="header-about">
                <span>About</span>
            </div>
        </div>
    </header>

    <main class="main-container">
        <!-- Omni-Search & Filter Bar -->
        <div class="search-wrapper">
            <form id="search-form" class="search-form" onsubmit="handleSearch(event)">
                <div class="search-input-container">
                    <svg class="search-icon" focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path></svg>
                    <input type="text" id="search-input" class="search-input" placeholder="Search papers, authors, keywords, or query IDs..." autocomplete="off">
                    <button type="submit" class="search-submit-btn">Explore</button>
                </div>
            </form>

            <!-- Dynamic Filter Pills -->
            <div class="filter-chips">
                <button class="chip active" data-intent="article-keyword" onclick="setIntent('article-keyword', this)">Papers by Keyword</button>
                <button class="chip" data-intent="article-text" onclick="setIntent('article-text', this)">Papers by Text</button>
                <button class="chip" data-intent="article-field" onclick="setIntent('article-field', this)">Papers by Field of Science</button>
                <button class="chip" data-intent="paper-info" onclick="setIntent('paper-info', this)">Paper Info</button>
                <button class="chip" data-intent="researcher-info" onclick="setIntent('researcher-info', this)">Researcher</button>
                <button class="chip" data-intent="researcher-alike" onclick="setIntent('researcher-alike', this)">Similar Researchers</button>
                <button class="chip" data-intent="researcher-hindex" onclick="setIntent('researcher-hindex', this)">H-Index</button>
                <button class="chip" data-intent="researcher-articles" onclick="setIntent('researcher-articles', this)">Researcher works</button>
                <button class="chip" data-intent="keyword-search" onclick="setIntent('keyword-search', this)">Keywords</button>
                <button class="chip" data-intent="keyword-community" onclick="setIntent('keyword-community', this)">Keywords together</button>
                <button class="chip" data-intent="networking" onclick="setIntent('networking', this)">Network Path (id1,id2)</button>
                <button class="chip" data-intent="custom-query" onclick="setIntent('custom-query', this)">Raw Query</button>
            </div>
        </div>

        <!-- Result Workspace -->
        <section id="workspace" class="workspace">
            <div class="placeholder-state">
                <p>Enter a query above or select a filter category to explore the academic graph.</p>
            </div>
        </section>
    </main>

    <script src="assets/app.js"></script>
</body>

</html>
