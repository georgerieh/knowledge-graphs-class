services:
  neo4j:
    image: neo4j:5.20
    environment:
      NEO4J_AUTH: ${graphs_username}/${graphs_pass}
      NEO4J_PLUGINS: '["apoc","graph-data-science","bloom"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_default__database: shop
    ports: ["7474:7474","7687:7687"]
    volumes:
      - ./neo4j/data:/data
      - ./neo4j/import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  api:
    build: .
    tty: true       
    stdin_open: true
    ports:
      - "8000:8000"
    environment:
      AI_API_URL: ${url_model} 
      NEO4J_URI: bolt://neo4j:7687
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GRAPHS_USERNAME: ${graphs_username}
      GRAPHS_PASS: ${graphs_pass}
      PYTHONUNBUFFERED: 1
      CLEAN: ${CLEAN:1}
      stage: prod
    volumes:
      # - .:/app
      - /app/.venv
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 5G
        reservations:
          memory: 1G

