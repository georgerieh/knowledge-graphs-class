services:
  neo4j:
    image: neo4j:5.20
    hostname: neo4j_container
    environment:
      NEO4J_AUTH: ${graphs_username}/${graphs_pass}
      NEO4J_PLUGINS: '["apoc","graph-data-science","bloom"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_server_config_strict__validation_enabled: "false"
      NEO4J_dbms_default__database: shop
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_pagecache_size: 128M
      # NEO4J_dbms_memory_transaction_total__max: 512M
    ports: ["7474:7474","7687:7687"]
    volumes:
      - ${NEO4J_DATA}/data:/data
      - ${NEO4J_DATA}/import:/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 180s
    deploy:
      resources:
          limits:
            memory: 768m
            cpus: "0.50"
    networks:
      - app-net
  api:
    build: .
    tty: true       
    stdin_open: true
    ports:
      - "8080:8000"
    environment:
      AI_API_URL: ${url_model} 
      NEO4J_URI: bolt://neo4j:7687
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GRAPHS_USERNAME: ${graphs_username}
      GRAPHS_PASS: ${graphs_pass}
      PYTHONUNBUFFERED: 1
      CLEAN: ${CLEAN:-0}
      env: ${env}
    volumes:
      - .:/app
      # - ./neo4j.tar.gz:/app/neo4j.tar.gz
      - /app/.venv
    depends_on:
      neo4j:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.50"
    networks:
      - app-net
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ./dist:/usr/share/nginx/html
    depends_on:
      - api
    networks:
      - app-net
networks:
  app-net:
    driver: bridge